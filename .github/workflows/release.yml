# Baut fertige Programme für Windows, Mac und Linux.
#  - Neue Version: auf GitHub "Actions" -> "Programme bauen" -> "Run workflow".
#    Danach gibt es unter "Releases" eine neue Version (v1.0.<Nummer>) mit allen Dateien.
#  - Ein Tag wie v2.0.0 erstellt ebenfalls ein Release mit diesem Namen.
# PyInstaller wird nur zum Verpacken gebraucht – die App selbst benutzt
# weiterhin nur die Standardbibliothek.
name: Programme bauen

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m unittest -v test_klassenzimmer

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: Klassenzimmer-Windows.exe
          - os: macos-latest
            file: Klassenzimmer-Mac.zip
          - os: ubuntu-latest
            file: Klassenzimmer-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyinstaller

      - name: Windows / Linux bauen
        if: runner.os != 'macOS'
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name Klassenzimmer klassenzimmer.py
          mkdir out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/Klassenzimmer.exe "out/${{ matrix.file }}"
          else
            cp dist/Klassenzimmer "out/${{ matrix.file }}"
          fi

      - name: Mac bauen
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name Klassenzimmer --osx-bundle-identifier ch.klassenzimmer.app klassenzimmer.py
          # macOS fragt seit Version 15 nach, bevor eine App im lokalen Netz senden darf.
          # Dafür braucht die App einen Text, warum sie das will:
          plutil -insert NSLocalNetworkUsageDescription -string "Klassenzimmer sucht andere Teilnehmer im lokalen Netzwerk." dist/Klassenzimmer.app/Contents/Info.plist
          codesign --force --deep -s - dist/Klassenzimmer.app
          mkdir out
          ditto -c -k --keepParent dist/Klassenzimmer.app "out/${{ matrix.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          # Bei einem Tag dessen Namen nehmen, sonst automatisch v1.0.<Nummer>
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          body: |
            Anleitung für Installation und Autostart: siehe **INSTALLATION.md** im Repository.

            **Windows:** `Klassenzimmer-Windows.exe` in einen festen Ordner legen und starten. *Weitere Informationen → Trotzdem ausführen*, bei der Firewall *Private Netzwerke → Zulassen*.
            **Mac (Apple-Chip):** `Klassenzimmer-Mac.zip` entpacken, App in *Programme* ziehen, öffnen, dann *Systemeinstellungen → Datenschutz & Sicherheit → Dennoch öffnen*. Lokales Netzwerk *Erlauben*.
            **Linux:** `Klassenzimmer-Linux` nach `~/.local/bin/` verschieben, `chmod +x`, starten. Mit ufw: `sudo ufw allow 50505:50506/udp`.
